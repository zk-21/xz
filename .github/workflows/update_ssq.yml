name: 更新双色球数据

permissions:
  contents: write

on:
  schedule:
    - cron: '50 13 * * 1,3,6'   # 周一/三/六 21:50（北京时间，双色球开奖后）
    - cron: '20 14 * * 1,3,6'   # 周一/三/六 22:20（北京时间）
  workflow_dispatch:  # 手动触发

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install requests openpyxl

      - name: 下载双色球数据
        continue-on-error: true
        run: python scripts/update_data_ssq.py

      - name: 提交更新
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add all_draws_ssq.js 1_ssq.xlsx
          if git diff --staged --quiet; then
            echo "无新数据，跳过提交"
          else
            git commit -m "自动更新双色球数据 $(date +%Y-%m-%d)"
            git pull --rebase origin main
            git push origin main
          fi
